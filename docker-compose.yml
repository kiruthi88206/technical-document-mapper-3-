version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technical_document_mapper
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=production-secure-random-key-replace-in-env
      - MAX_UPLOAD_SIZE_MB=25
      - DATABASE_URL=sqlite:///backend/instance/tech_mapper.db
    volumes:
      - app_data:/app/backend/instance
      - app_uploads:/app/backend/uploads
      - app_exports:/app/backend/exports
    restart: unless-stopped

volumes:
  app_data:
  app_uploads:
  app_exports:
